name: Update ByTowne Calendar

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 4:00 AM UTC
  workflow_dispatch:      # Allows manual testing from the Actions tab

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 ics python-dateutil

      - name: Run Scraper
        run: |
          python bytowne_scraper.py

      - name: Update Secret Gist
        env:
          # Use your PAT secret instead of GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          gh gist edit "$GIST_ID" bytowne.ics --add bytowne.ics
